spring.application.name=goaja-spring

# DataSource is configured programmatically in DatabaseConfig.java
# (rewrites Railway's postgres:// URL to jdbc:postgresql://)

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server port — Railway injects PORT
server.port=${PORT:8080}

# Multipart upload limits — 4 documents per driver application
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
