<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoAja — Tracking Pesanan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .track-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 64px); /* full viewport minus navbar */
            border-top: 2px solid var(--border);
        }

        /* ── Info Panel ── */
        .track-info {
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .track-info-header {
            padding: 2rem 2rem 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .track-eyebrow {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .track-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: var(--fg);
            line-height: 1;
        }

        .track-body {
            padding: 1.5rem 2rem;
            flex: 1;
        }

        .track-field {
            padding: 1.25rem 0;
            border-bottom: 1px solid var(--border);
        }

        .track-field:last-child { border-bottom: none; }

        .track-field-label {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted-fg);
            margin-bottom: 0.4rem;
        }

        .track-field-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--fg);
        }

        .track-status {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.4rem 0.9rem;
            border: 2px solid;
        }

        .track-status-waiting  { color: #f59e0b; border-color: #f59e0b; }
        .track-status-active   { color: #22c55e; border-color: #22c55e; }
        .track-status-done     { color: var(--muted-fg); border-color: var(--border); }

        .track-eta {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--accent);
            line-height: 1;
        }

        .track-eta-unit {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted-fg);
            margin-left: 0.4rem;
        }

        .track-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 3rem 2rem;
            color: var(--muted-fg);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .track-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .track-error {
            margin: 1.5rem 2rem;
            padding: 1rem;
            border-left: 3px solid var(--accent);
            background: rgba(222,49,99,0.08);
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
        }

        /* ── Map ── */
        .track-map-wrap {
            position: relative;
        }

        #trackingMap {
            width: 100%;
            height: 100%;
        }

        /* Dark Leaflet tiles */
        .leaflet-tile-container {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        .leaflet-container {
            background: #09090b !important;
            font-family: 'Space Grotesk', sans-serif;
        }
        .leaflet-bar {
            border: 2px solid var(--border) !important;
            border-radius: 0 !important;
            background: var(--bg) !important;
        }
        .leaflet-bar a {
            background: var(--bg) !important;
            color: var(--fg) !important;
            border-bottom: 1px solid var(--border) !important;
            border-radius: 0 !important;
        }
        .leaflet-bar a:hover {
            background: var(--fg) !important;
            color: var(--bg) !important;
        }

        @media (max-width: 768px) {
            .track-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 400px;
                height: auto;
            }
            .track-info { border-right: none; border-bottom: 2px solid var(--border); }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="site-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-brand" href="/">Go<span>Aja</span></a>
    <ul class="nav-links" id="navLinks" role="list">
        <li th:if="${currentRole == 'USER'}"><a href="/">Beranda</a></li>
        <li th:if="${currentRole == 'USER'}"><a href="/orders">Pesanan</a></li>
        <li th:if="${currentRole == 'USER'}"><a href="/driver/apply">Gabung jadi Driver</a></li>
        <li th:if="${currentRole == 'DRIVER'}"><a href="/orders">Pesanan</a></li>
        <li th:if="${currentRole == 'ADMIN'}"><a href="/drivers">Driver</a></li>
        <li th:if="${currentRole == 'ADMIN'}"><a href="/drivers/applications">Aplikasi Driver</a></li>
        <li th:if="${currentRole == 'ADMIN'}"><a href="/layanan">Layanan</a></li>
    </ul>
    <div class="nav-right">
        <span class="nav-user" sec:authentication="name">User</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">Keluar</button>
        </form>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    </div>
</nav>

<!-- MAIN LAYOUT -->
<div class="track-layout" id="trackApp"
     th:attr="data-order-id=${orderId}, data-role=${currentRole}">

    <!-- Info Panel -->
    <div class="track-info">
        <div class="track-info-header">
            <p class="track-eyebrow">Live</p>
            <h1 class="track-title">Tracking<br>Pesanan</h1>
        </div>
        <div class="track-body" id="trackContent">
            <div class="track-loading">
                <div class="track-spinner"></div>
                Memuat data...
            </div>
        </div>
    </div>

    <!-- Map -->
    <div class="track-map-wrap">
        <div id="trackingMap"></div>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var _app     = document.getElementById('trackApp');
    var orderId     = parseInt(_app.getAttribute('data-order-id'), 10) || 0;
    var currentRole = _app.getAttribute('data-role') || 'USER';

    // ── State ────────────────────────────────────────────────
    const state = {
        map: null,
        markers: { pickup: null, destination: null, driver: null, user: null, self: null },
        icons: {},
        routePolyline: null,
        watchId: null,
        initialBoundsDone: false
    };

    // ── Map icons ─────────────────────────────────────────────
    function makeIcon(emoji, size) {
        size = size || 28;
        return L.divIcon({
            className: '',
            html: '<div style="font-size:' + size + 'px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6))">' + emoji + '</div>',
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2]
        });
    }

    function makeDotIcon(color) {
        return L.divIcon({
            className: '',
            html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color + ';border:3px solid #fff;box-shadow:0 0 0 3px ' + color + '55;"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });
    }

    // ── Init map ──────────────────────────────────────────────
    function initMap() {
        // Build icons here so any L.divIcon error is contained
        state.icons.pickup      = makeIcon('📍');
        state.icons.destination = makeIcon('📌');
        state.icons.driver      = makeIcon('🚗');
        state.icons.user        = makeIcon('👤');
        state.icons.self        = makeDotIcon('#3b82f6');
        state.map = L.map('trackingMap', { zoomControl: false })
            .setView([-6.2088, 106.8456], 13);

        L.control.zoom({ position: 'bottomright' }).addTo(state.map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(state.map);

        // Zoom to user's real position immediately
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                state.map.setView([pos.coords.latitude, pos.coords.longitude], 15);
            }, () => {}, { enableHighAccuracy: true, timeout: 8000 });
        }
    }

    // ── Update a marker ───────────────────────────────────────
    function updateMarker(type, lat, lng) {
        if (lat == null || lng == null) return;
        if (state.markers[type]) state.map.removeLayer(state.markers[type]);
        var icon = state.icons[type] || state.icons.self;
        state.markers[type] = L.marker([lat, lng], { icon: icon }).addTo(state.map);
    }

    // ── Draw straight-line route ──────────────────────────────
    function drawRoute(pLat, pLng, dLat, dLng) {
        if (state.routePolyline) state.map.removeLayer(state.routePolyline);
        var points = [ [pLat, pLng], [dLat, dLng] ];
        state.routePolyline = L.polyline(points, {
            color: '#DE3163', weight: 3, opacity: 0.5, dashArray: '6, 6'
        }).addTo(state.map);
    }

    // ── Fit map to all visible points ─────────────────────────
    function fitBoundsToAll() {
        const points = Object.values(state.markers)
            .filter(m => m != null)
            .map(m => m.getLatLng());
        if (points.length >= 2) {
            state.map.fitBounds(L.latLngBounds(points), { padding: [60, 60] });
        }
    }

    // ── Build info panel HTML ─────────────────────────────────
    function renderInfo(data) {
        var statusLabels = {
            MENUNGGU: 'Menunggu Driver',
            DIJEMPUT: 'Driver Menuju Anda',
            SAMPAI:   'Driver Tiba',
            SELESAI:  'Selesai'
        };
        var statusClasses = {
            MENUNGGU: 'track-status-waiting',
            DIJEMPUT: 'track-status-active',
            SAMPAI:   'track-status-active',
            SELESAI:  'track-status-done'
        };

        var statusLabel = statusLabels[data.status] || data.status || '—';
        var statusClass = statusClasses[data.status] || 'track-status-waiting';
        var etaHtml = data.etaMinutes
            ? '<div class="track-eta">' + data.etaMinutes + '<span class="track-eta-unit">menit</span></div>'
            : '<div class="track-field-value">—</div>';
        var driverPos = (data.driverLat != null)
            ? data.driverLat.toFixed(5) + ', ' + data.driverLng.toFixed(5)
            : 'Belum tersedia';
        var userPos = (data.userLat != null)
            ? data.userLat.toFixed(5) + ', ' + data.userLng.toFixed(5)
            : 'Belum tersedia';

        return '<div class="track-field">' +
                   '<div class="track-field-label">Status</div>' +
                   '<span class="track-status ' + statusClass + '">' + statusLabel + '</span>' +
               '</div>' +
               '<div class="track-field">' +
                   '<div class="track-field-label">⏱ ETA</div>' +
                   etaHtml +
               '</div>' +
               '<div class="track-field">' +
                   '<div class="track-field-label">🚗 Posisi Driver</div>' +
                   '<div class="track-field-value">' + driverPos + '</div>' +
               '</div>' +
               '<div class="track-field">' +
                   '<div class="track-field-label">👤 Posisi Penumpang</div>' +
                   '<div class="track-field-value">' + userPos + '</div>' +
               '</div>' +
               '<div class="track-field">' +
                   '<div class="track-field-label">ID Pesanan</div>' +
                   '<div class="track-field-value">#' + data.orderId + '</div>' +
               '</div>';
    }

    // ── Fetch & refresh tracking data ─────────────────────────
    async function fetchTrackingData() {
        try {
            const res = await fetch('/api/orders/' + orderId + '/track', {
                credentials: 'same-origin'
            });
            if (!res.ok) {
                const body = await res.text();
                throw new Error('HTTP ' + res.status + ': ' + body.substring(0, 200));
            }
            const data = await res.json();

            document.getElementById('trackContent').innerHTML = renderInfo(data);

            if (data.driverLat != null) updateMarker('driver', data.driverLat, data.driverLng);
            if (data.userLat   != null) updateMarker('user',   data.userLat,   data.userLng);

            if (!state.initialBoundsDone && (data.driverLat != null || data.userLat != null)) {
                fitBoundsToAll();
                state.initialBoundsDone = true;
            }
        } catch (err) {
            document.getElementById('trackContent').innerHTML =
                '<div class="track-error">⚠ Gagal memuat data tracking.<br>' +
                '<small style="opacity:0.7;word-break:break-all">' + err.message + '</small><br><br>' +
                '<small>Order ID: ' + orderId + ' | Role: ' + currentRole + '</small><br>' +
                '<small>Mencoba ulang setiap 3 detik...</small></div>';
            console.error('Tracking error:', err);
        }
    }

    // ── Load pickup/destination from order ────────────────────
    async function loadOrderDetails() {
        try {
            const res = await fetch('/api/orders/' + orderId, {
                credentials: 'same-origin'
            });
            if (!res.ok) return;
            const order = await res.json();

            if (order.lokasiJemputLat != null) {
                updateMarker('pickup', order.lokasiJemputLat, order.lokasiJemputLng);
            }
            if (order.lokasiTujuanLat != null) {
                updateMarker('destination', order.lokasiTujuanLat, order.lokasiTujuanLng);
            }
            if (order.lokasiJemputLat != null && order.lokasiTujuanLat != null) {
                drawRoute(order.lokasiJemputLat, order.lokasiJemputLng,
                          order.lokasiTujuanLat, order.lokasiTujuanLng);
                fitBoundsToAll();
                state.initialBoundsDone = true;
            }
        } catch (e) {
            console.error('Error loading order details:', e);
        }
    }

    // ── Share this user's live GPS position ───────────────────
    function shareMyLocation() {
        if (!navigator.geolocation || !orderId) return;

        var endpoint = currentRole === 'DRIVER'
            ? '/api/orders/' + orderId + '/driver-location'
            : '/api/orders/' + orderId + '/user-location';

        state.watchId = navigator.geolocation.watchPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;

            updateMarker('self', lat, lng);

            fetch(endpoint, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lng: lng })
            }).catch(function(err) { console.error('Location push error:', err); });

        }, function(err) { console.error('Geolocation error:', err); }, {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        });
    }

    // ── Bootstrap ─────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        try {
            // Nav toggle
            document.getElementById('navToggle').addEventListener('click', function() {
                const nl = document.getElementById('navLinks');
                const open = nl.classList.toggle('open');
                this.setAttribute('aria-expanded', open);
            });

            initMap();
            loadOrderDetails();
            fetchTrackingData();
            setInterval(fetchTrackingData, 3000);
            shareMyLocation();
        } catch (bootErr) {
            document.getElementById('trackContent').innerHTML =
                '<div class="track-error">⚠ Gagal memulai tracking.<br><small style="opacity:0.7;word-break:break-all">' + bootErr.message + '</small><br><small>Order ID: ' + orderId + ' | Role: ' + currentRole + '</small></div>';
            console.error('Boot error:', bootErr);
        }
    });
</script>
</body>
</html>
